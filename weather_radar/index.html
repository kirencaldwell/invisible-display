<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather</title>
<style>
  :root {
    --bg: #eef2f7; --card: #ffffff; --text: #18202b; --muted: #6b7686; --line: #e3e8ef;
    --accent: #2f7de1; --hi: #e8743b; --lo: #4a90d9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151b; --card: #1a2029; --text: #e8edf3; --muted: #8b97a8; --line: #2a3340; --accent: #5aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: 1fr 1fr; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .wide { grid-column: 1 / -1; }
  h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .now { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .now .icon { font-size: 76px; line-height: 1; }
  .now .temp { font-size: 72px; font-weight: 300; line-height: 1; }
  .now .temp sup { font-size: 28px; color: var(--muted); font-weight: 400; vertical-align: top; position: relative; top: 8px; }
  .now .cond { font-size: 22px; }
  .now .sub { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin-top: 18px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-size: 18px; font-weight: 600; }
  .stat span { font-size: 12px; color: var(--muted); }
  .hours { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 6px; }
  .hour { flex: 0 0 64px; text-align: center; padding: 8px 0; border-radius: 12px; }
  .hour:first-child { background: var(--bg); }
  .hour .t { font-size: 13px; color: var(--muted); }
  .hour .i { font-size: 28px; margin: 4px 0; }
  .hour .d { font-weight: 600; }
  .hour .p { font-size: 12px; color: var(--accent); height: 16px; }
  .day { display: grid; grid-template-columns: 56px 36px 40px 1fr 84px; align-items: center; gap: 8px; padding: 9px 0;
         border-top: 1px solid var(--line); }
  .day:first-of-type { border-top: 0; }
  .day .n { font-weight: 600; }
  .day .i { font-size: 24px; text-align: center; }
  .day .p { font-size: 12px; color: var(--accent); }
  .day .lo { color: var(--muted); text-align: right; }
  .day .hi { font-weight: 600; }
  .bar { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, var(--lo), var(--hi)); }
  .radar img { width: 100%; border-radius: 12px; display: block; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; padding: 0 0 16px; }
  .msg { color: var(--muted); padding: 24px 0; text-align: center; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } .now .temp { font-size: 60px; } }
</style>
</head>
<body>
<main>
  <section class="card wide" id="now"><div class="msg">Loading weather…</div></section>
  <section class="card wide"><h2>Next 24 hours</h2><div class="hours" id="hours"></div></section>
  <section class="card"><h2>7-day forecast</h2><div id="days"></div></section>
  <section class="card radar"><h2>Radar · recent past, then forecast</h2><img id="radar" src="radar.gif" alt="Animated radar" onerror="setTimeout(() => this.src = 'radar.gif?t=' + Date.now(), 10000)"></section>
</main>
<div class="foot" id="foot"></div>
<script>
const ICONS = {
  "sunny": "☀️", "clear-night": "🌙", "partlycloudy": "⛅", "cloudy": "☁️", "fog": "🌫️", "hail": "🌨️",
  "lightning": "🌩️", "lightning-rainy": "⛈️", "pouring": "🌧️", "rainy": "🌦️", "snowy": "❄️",
  "snowy-rainy": "🌨️", "windy": "💨", "windy-variant": "💨", "exceptional": "⚠️"
};
const LABELS = {
  "sunny": "Sunny", "clear-night": "Clear", "partlycloudy": "Partly cloudy", "cloudy": "Cloudy", "fog": "Fog",
  "hail": "Hail", "lightning": "Thunder", "lightning-rainy": "Thunderstorms", "pouring": "Heavy rain",
  "rainy": "Rain", "snowy": "Snow", "snowy-rainy": "Sleet", "windy": "Windy", "windy-variant": "Windy",
  "exceptional": "Severe"
};
const $ = id => document.getElementById(id);
const num = v => (v === null || v === undefined || isNaN(v)) ? null : Number(v);
const deg = v => num(v) === null ? "–" : Math.round(v) + "°";
const isNight = d => { const h = d.getHours(); return h < 6 || h >= 20; };
const icon = (c, night) => (c === "sunny" && night) ? ICONS["clear-night"] : (c === "clear-night" && !night) ? ICONS["sunny"] : (ICONS[c] || "☁️");
const label = c => LABELS[c] || (c ? c.replace(/-/g, " ").replace(/^./, m => m.toUpperCase()) : "");
const hourFmt = d => d.toLocaleTimeString([], { hour: "numeric" });

function render(data) {
  const wx = data.weather;
  if (!wx) { $("now").innerHTML = '<div class="msg">Weather data isn’t available yet. Check the add-on log and weather entity.</div>'; return; }
  const a = wx.attributes, tu = a.temperature_unit || "°F";
  const hours = wx.hourly.map(h => ({ ...h, d: new Date(h.datetime) }));
  const nowD = new Date();
  const upcoming = hours.filter(h => h.d.getTime() > nowD.getTime() - 3600e3);
  const cond = wx.state, night = isNight(nowD);
  const today = (wx.daily || []).find(d => new Date(d.datetime).toDateString() === nowD.toDateString());
  const stats = [];
  const add = (v, unit, name) => { if (num(v) !== null) stats.push(`<div class="stat"><b>${Math.round(v)}${unit}</b><span>${name}</span></div>`); };
  add(a.apparent_temperature, "°", "Feels like");
  add(a.humidity, "%", "Humidity");
  if (num(a.wind_speed) !== null) stats.push(`<div class="stat"><b>${Math.round(a.wind_speed)} ${a.wind_speed_unit || ""}</b><span>Wind</span></div>`);
  add(a.pressure, " " + (a.pressure_unit || ""), "Pressure");
  add(a.uv_index, "", "UV index");
  add(a.visibility, " " + (a.visibility_unit || ""), "Visibility");
  const rain = upcoming.length ? num(upcoming[0].precipitation_probability) : (today ? num(today.precipitation_probability) : null);
  add(rain, "%", "Chance of rain");
  $("now").innerHTML = `
    <div class="now">
      <div class="icon">${icon(cond, night)}</div>
      <div><div class="temp">${num(a.temperature) === null ? "–" : Math.round(a.temperature)}<sup>${tu}</sup></div></div>
      <div><div class="cond">${label(cond)}</div>
        <div class="sub">${today ? `High ${deg(today.temperature)} · Low ${deg(today.templow)}` : ""}</div>
        <div class="sub">${nowD.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}</div></div>
    </div>
    <div class="stats">${stats.join("")}</div>`;

  $("hours").innerHTML = upcoming.slice(0, 24).map(h => {
    const p = num(h.precipitation_probability);
    return `<div class="hour"><div class="t">${hourFmt(h.d)}</div><div class="i">${icon(h.condition, h.is_daytime === false || isNight(h.d))}</div>
      <div class="d">${deg(h.temperature)}</div><div class="p">${p !== null && p >= 10 ? Math.round(p) + "%" : ""}</div></div>`;
  }).join("") || '<div class="msg">Hourly forecast unavailable</div>';

  const days = (wx.daily || []).slice(0, 7).map(d => ({ ...d, d: new Date(d.datetime) }));
  const temps = days.flatMap(d => [num(d.temperature), num(d.templow)]).filter(v => v !== null);
  const min = Math.min(...temps), max = Math.max(...temps), span = Math.max(max - min, 1);
  $("days").innerHTML = days.map(d => {
    const hi = num(d.temperature), lo = num(d.templow), p = num(d.precipitation_probability);
    const l = ((lo ?? hi) - min) / span * 100, r = ((hi ?? lo) - min) / span * 100;
    const name = d.d.toDateString() === nowD.toDateString() ? "Today" : d.d.toLocaleDateString([], { weekday: "short" });
    return `<div class="day"><div class="n">${name}</div><div class="i">${icon(d.condition, false)}</div>
      <div class="p">${p !== null && p >= 20 ? Math.round(p) + "%" : ""}</div>
      <div class="bar"><i style="left:${l}%;width:${Math.max(r - l, 4)}%"></i></div>
      <div><span class="lo">${deg(lo)}</span> <span class="hi">${deg(hi)}</span></div></div>`;
  }).join("") || '<div class="msg">Daily forecast unavailable</div>';
  $("foot").textContent = "Updated " + new Date(data.updated).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) +
    " · Radar: NOAA NEXRAD via Iowa Environmental Mesonet · Map © OpenStreetMap contributors";
}

async function load() {
  try {
    const r = await fetch("weather.json", { cache: "no-store" });
    render(await r.json());
  } catch (e) { $("now").innerHTML = '<div class="msg">Could not load weather.</div>'; }
  $("radar").src = "radar.gif?t=" + Date.now();
}
load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
