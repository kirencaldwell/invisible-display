name: Weather Radar
version: "0.1.0"
slug: weather_radar
description: Animated NEXRAD weather radar (color and black-and-white) for your location
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:weather-pouring
panel_title: Radar
ports:
  8080/tcp: 8101
ports_description:
  8080/tcp: Radar images (/radar.gif, /radar_bw.gif) for dashboards
options:
  latitude: 0
  longitude: 0
  zoom: 8
  width: 800
  height: 480
  frame_ms: 500
  refresh_minutes: 5
schema:
  latitude: float?
  longitude: float?
  zoom: int(5,10)
  width: int(300,1200)
  height: int(200,900)
  frame_ms: int(100,3000)
  refresh_minutes: int(2,60)
