name: Weather Radar
version: "0.3.0"
slug: weather_radar
description: Weather forecast and animated NEXRAD radar for your location
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:weather-partly-rainy
panel_title: Weather
ports:
  8080/tcp: 8101
ports_description:
  8080/tcp: Radar images (/radar.gif, /radar_bw.gif) for dashboards
options:
  weather_entity: weather.forecast_home
  weather_fallback_entity: ""
  latitude: 0
  longitude: 0
  zoom: 8
  width: 800
  height: 480
  frame_ms: 500
  refresh_minutes: 5
schema:
  weather_entity: str
  weather_fallback_entity: str?
  latitude: float?
  longitude: float?
  zoom: int(5,10)
  width: int(300,1200)
  height: int(200,900)
  frame_ms: int(100,3000)
  refresh_minutes: int(2,60)
