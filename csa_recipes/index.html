<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSA Recipes</title>
<style>
  :root { --bg:#f3f1ea; --card:#fff; --text:#1f2a1f; --muted:#6c756a; --line:#e4e1d6; --green:#3b7d3a; --green-d:#2c5f2b; --warn:#b3412b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12160f; --card:#1b2118; --text:#e9eee5; --muted:#8e9a8a; --line:#2b3427; --green:#6fbb6a; --green-d:#8ad186; --warn:#ef8a74; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  h1 { margin: 4px 0 0; font-size: 24px; }
  h2 { margin: 0 0 12px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  button, .btn { font: inherit; border: 0; border-radius: 12px; padding: 12px 18px; background: var(--green); color: #fff; font-weight: 600; cursor: pointer; display: inline-block; }
  button.secondary, .btn.secondary { background: transparent; color: var(--green-d); border: 1.5px solid var(--green); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .item { display: grid; grid-template-columns: 110px 1fr 36px; gap: 8px; margin-bottom: 8px; }
  .item input { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); width: 100%; }
  .item button { padding: 0; background: transparent; color: var(--muted); font-size: 20px; }
  textarea { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); resize: vertical; }
  .g { display: grid; grid-template-columns: 28px 1fr 32px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
  .g:first-child { border-top: 0; }
  .g.have .t { text-decoration: line-through; color: var(--muted); }
  .g small { display: block; color: var(--muted); font-size: 12px; }
  .g input[type=checkbox] { width: 20px; height: 20px; }
  .g button { padding: 0; background: transparent; color: var(--muted); font-size: 20px; }
  #addG, #onhand, select { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); width: 100%; }
  select { width: auto; }
  .err { color: var(--warn); margin: 10px 0 0; }
  .muted { color: var(--muted); }
  .recipe { border-top: 1px solid var(--line); padding: 16px 0; }
  .recipe:first-of-type { border-top: 0; padding-top: 0; }
  .recipe h3 { margin: 0; font-size: 19px; }
  .recipe .meta { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
  .recipe details summary { cursor: pointer; color: var(--green-d); font-weight: 600; margin: 8px 0; }
  .recipe ul, .recipe ol { margin: 6px 0 10px; padding-left: 22px; }
  .recipe li.box { font-weight: 600; }
  .pinned { outline: 2px solid var(--green); }
  .badge { display:inline-block; background: var(--green); color:#fff; border-radius: 8px; padding: 1px 8px; font-size: 12px; font-weight: 600; margin-left: 8px; vertical-align: middle; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <header><h1>🥬 CSA Recipes</h1><div class="muted">Photograph this week’s letter, pick a recipe, and show it on the display.</div></header>

  <section class="card" id="pinbar" hidden></section>

  <section class="card">
    <h2>1 · The letter</h2>
    <div class="row">
      <button id="camBtn" hidden>📷 Take photo</button>
      <label class="btn" id="photoBtn"><span id="photoLbl">📷 Take or choose photo</span><input type="file" id="photo" accept="image/*" capture="environment"></label>
      <label class="btn secondary" id="libBtn">🖼 Choose from library<input type="file" id="lib" accept="image/*"></label>
      <span class="muted" id="status"></span>
    </div>
    <div class="err" id="err"></div>
  </section>

  <div id="cam" hidden style="position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column">
    <video id="vid" autoplay playsinline muted style="flex:1;min-height:0;width:100%;object-fit:contain"></video>
    <div class="row" style="justify-content:center;padding:16px;gap:16px">
      <button class="secondary" id="camCancel" style="color:#fff;border-color:#fff">Cancel</button>
      <button id="camShoot">Capture</button>
    </div>
  </div>

  <section class="card" id="itemsCard" hidden>
    <h2>2 · In this week’s box</h2>
    <div id="items"></div>
    <label class="muted" for="request" style="display:block;margin:14px 0 6px">Anything else Claude should know? (optional)</label>
    <textarea id="request" rows="2" maxlength="500" placeholder="e.g. Mexican-Korean fusion ideas, quick weeknight meals, kid-friendly, no oven"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="secondary" id="addItem">+ Add item</button>
      <label class="muted">Dinners <select id="meals"><option>2</option><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option></select></label>
      <button id="suggest">Plan meals</button>
    </div>
  </section>

  <section class="card" id="recipesCard" hidden>
    <h2>3 · Meal plan</h2>
    <div id="recipes"></div>
  </section>

  <section class="card" id="groceryCard" hidden>
    <h2>4 · Still to buy</h2>
    <div class="muted" style="margin-bottom:10px">Tick what you already have, remove what you don’t want to buy, then revise the plan around it.</div>
    <div id="grocery"></div>
    <div class="row" style="margin:10px 0">
      <input id="addG" placeholder="Add something to buy" style="flex:1;min-width:160px">
      <button class="secondary" id="addGBtn">Add</button>
    </div>
    <label class="muted" for="onhand" style="display:block;margin:10px 0 6px">Other things we have on hand (comma separated)</label>
    <input id="onhand" placeholder="e.g. rice, chicken thighs, coconut milk">
    <div class="row" style="margin-top:12px">
      <button id="revise">Revise plan around this</button>
      <button class="secondary" id="sendG">Send to Non-Costco list</button>
    </div>
    <div class="muted" id="sendMsg" style="margin-top:8px"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let S = { items: [], recipes: [], pinned: null, request: "", meals: 5, grocery: [], removed: [], on_hand: "" };
let busy = false;

async function api(path, body, raw) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", body: raw ? body : JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
function setBusy(msg) {
  busy = !!msg;
  $("status").innerHTML = msg ? `<span class="spin"></span>${esc(msg)}` : "";
  document.querySelectorAll("button").forEach(b => b.disabled = busy);
  $("photoBtn").style.opacity = busy ? .5 : 1;
  $("photo").disabled = busy;
  $("lib").disabled = busy;
}
async function run(msg, fn) {
  $("err").textContent = "";
  setBusy(msg);
  try { S = await fn(); } catch (e) { $("err").textContent = e.message; }
  setBusy("");
  render();
}

const isPinned = r => S.pinned && S.pinned.title === r.title;
function readItems() {
  return [...document.querySelectorAll(".item")].map(el => ({
    quantity: el.children[0].value, name: el.children[1].value })).filter(i => i.name.trim());
}
function render() {
  if (document.activeElement !== $("request")) $("request").value = S.request || $("request").value;
  $("itemsCard").hidden = !S.items.length && !document.querySelector(".item");
  $("items").innerHTML = S.items.map(i => `<div class="item"><input value="${esc(i.quantity)}" placeholder="qty"><input value="${esc(i.name)}" placeholder="item"><button title="Remove">×</button></div>`).join("");
  $("recipesCard").hidden = !S.recipes.length;
  $("groceryCard").hidden = !S.recipes.length;
  if (S.meals) $("meals").value = String(S.meals);
  if (document.activeElement !== $("onhand")) $("onhand").value = S.on_hand || "";
  const need = S.grocery.filter(g => !g.have).length;
  $("grocery").innerHTML = S.grocery.map((g, n) => `<div class="g ${g.have ? "have" : ""}"><input type="checkbox" data-have="${n}" ${g.have ? "checked" : ""} title="I have this">
      <div class="t">${esc(g.item)}${g.for && g.for.length ? `<small>${esc(g.for.join(", "))}</small>` : ""}</div>
      <button data-rm="${n}" title="Don’t buy">×</button></div>`).join("") || '<div class="muted">Nothing extra to buy.</div>';
  $("revise").disabled = busy;
  $("recipes").innerHTML = S.recipes.map((r, n) => `
    <div class="recipe ${isPinned(r) ? "pinned" : ""}">
      <h3>${esc(r.title)}${isPinned(r) ? '<span class="badge">On display</span>' : ""}</h3>
      <div class="meta">${[r.servings && r.servings + " servings", r.minutes && r.minutes + " min"].filter(Boolean).join(" · ")}</div>
      <details><summary>Ingredients &amp; steps</summary>
        <ul>${r.ingredients.map(i => `<li class="${i.from_box ? "box" : ""}">${esc(i.item)}</li>`).join("")}</ul>
        <ol>${r.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></details>
      ${isPinned(r)
        ? `<button class="secondary" data-unpin>Remove from display</button>`
        : `<button data-pin="${n}">Show on display</button>`}
    </div>`).join("");
  const p = S.pinned;
  $("pinbar").hidden = !p;
  if (p) $("pinbar").innerHTML = `<h2>On the e-ink display</h2><b>${esc(p.title)}</b>
    <div class="row" style="margin-top:10px"><button class="secondary" data-unpin>Remove from display</button></div>`;
}

function sendLetter(blob) {
  return run("Reading the letter…", async () => {
    const s = await api("api/letter", blob, true);
    if (!s.items.length) throw new Error("Couldn't find any items in that photo. Try again with better light, or add them by hand.");
    return s;
  });
}
for (const id of ["photo", "lib"]) $(id).addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  await sendLetter(f);
  e.target.value = "";
});

// In-page camera (only where the browser allows it: needs a secure context). Falls back to the file pickers.
let stream = null;
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $("cam").style.display = "none"; }
if (window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  $("camBtn").hidden = false;
  $("photoBtn").hidden = true;
  $("camBtn").onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 2560 } }, audio: false });
      $("vid").srcObject = stream; $("cam").style.display = "flex";
    } catch (e) { $("err").textContent = "Couldn't open the camera (" + e.name + "). Use “Choose from library” instead."; }
  };
  $("camCancel").onclick = stopCam;
  $("camShoot").onclick = () => {
    const v = $("vid"), c = document.createElement("canvas");
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext("2d").drawImage(v, 0, 0);
    stopCam();
    c.toBlob(b => sendLetter(b), "image/jpeg", 0.9);
  };
}
$("addItem").onclick = () => {
  S.items = [...readItems(), { quantity: "", name: "" }]; render();
  document.querySelector(".item:last-child input:nth-child(2)").focus();
};
$("items").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  e.target.parentElement.remove(); S.items = readItems();
  api("api/items", { items: S.items }).catch(() => {});
});
$("suggest").onclick = () => run("Planning the week… (this takes about a minute)", async () => {
  await api("api/items", { items: readItems() });
  return api("api/recipes", { request: $("request").value, meals: Number($("meals").value) });
});
document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.pin !== undefined) run("Sending to the display…", () => api("api/pin", { index: Number(t.dataset.pin) }));
  if (t.dataset.unpin !== undefined) run("Removing…", () => api("api/pin", { index: null }));
});
function saveGrocery() {
  return api("api/grocery", { grocery: S.grocery, removed: S.removed, on_hand: $("onhand").value })
    .then(s => { S = s; }).catch(e => { $("err").textContent = e.message; });
}
$("grocery").addEventListener("change", async e => {
  if (e.target.dataset.have === undefined) return;
  S.grocery[Number(e.target.dataset.have)].have = e.target.checked;
  render(); await saveGrocery(); render();
});
$("grocery").addEventListener("click", async e => {
  if (e.target.dataset.rm === undefined) return;
  const [g] = S.grocery.splice(Number(e.target.dataset.rm), 1);
  S.removed = [...(S.removed || []), g.item];
  render(); await saveGrocery(); render();
});
$("addGBtn").onclick = async () => {
  const v = $("addG").value.trim(); if (!v) return;
  S.grocery.push({ item: v, for: [], have: false }); $("addG").value = "";
  render(); await saveGrocery(); render();
};
$("onhand").addEventListener("change", saveGrocery);
$("sendG").onclick = async () => {
  $("sendMsg").textContent = ""; $("err").textContent = "";
  setBusy("Sending to the list…");
  try {
    await saveGrocery();
    const r = await api("api/send-grocery", {});
    $("sendMsg").textContent = `Added ${r.added} item${r.added === 1 ? "" : "s"}` + (r.skipped ? ` (${r.skipped} already on the list)` : "") + ".";
  } catch (e) { $("err").textContent = e.message; }
  setBusy(""); render();
};
$("revise").onclick = () => run("Revising the plan… (about a minute)", async () => {
  await saveGrocery();
  return api("api/revise", { request: $("request").value });
});
api("api/state").then(s => { S = s; render(); }).catch(() => {});
</script>
</body>
</html>
