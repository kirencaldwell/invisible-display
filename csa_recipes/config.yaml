name: CSA Recipes
version: "0.8.0"
slug: csa_recipes
description: Photograph your CSA delivery letter, get recipe ideas, and pin one to the e-ink display
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8080
panel_icon: mdi:food-apple
panel_title: CSA Recipes
panel_admin: false
ports:
  8080/tcp: 8102
ports_description:
  8080/tcp: Pinned recipe JSON for the e-ink display (/pinned.json)
options:
  todo_entity: todo.non_costco_list
  recipes_url: http://abd13010-recipes:8080
  helper_url: ""
  helper_token: ""
  recipe_count: 4
  dietary_notes: ""
schema:
  todo_entity: str?
  recipes_url: str?
  helper_url: str
  helper_token: password
  recipe_count: int(2,8)
  dietary_notes: str?
